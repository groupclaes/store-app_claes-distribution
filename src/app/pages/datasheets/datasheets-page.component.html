<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title translate="datasheetsPage"></ion-title>
    <ion-buttons slot="end">
      <ion-button tappable class="icon-only" [routerLink]="cartLink">
        <i class="fal fa-lg fa-fw fa-shopping-cart"></i>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar inputmode="search" show-clear-button="always" [debounce]="300"
                   [placeholder]="'searchInput' | translate" (ionInput)="filter($event)">
    </ion-searchbar>
    <ion-progress-bar type="indeterminate" *ngIf="loading"></ion-progress-bar>
    <ion-progress-bar [value]="progress" *ngIf="isDownloading"></ion-progress-bar>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" color="light">
  <cdk-virtual-scroll-viewport style="height: 100%; width: 100%" minBufferPx="1050" maxBufferPx="2350" itemSize="75">
    <ion-list inset="true" *ngIf="!loading || datasheets.length > 0">
      <ion-item button *cdkVirtualFor="let datasheet of datasheets" tappable
                (click)="openDatasheet(datasheet)">
        <ion-label>
          <strong>
            {{ datasheet.itemnum }}
          </strong>
          <br>
          <ion-text style="font-size:clamp(.875rem, 3vw, 0.875rem)">
            {{ datasheet.product_name }}
          </ion-text>
          <br>
          <ion-note style="font-size: .875rem" color="medium" class="ion-text-wrap">
            {{ 'lastPurchase' | translate }}: {{ datasheet.lastB | date:'dd/MM/YYYY' }}
          </ion-note>
        </ion-label>
<!--        <ion-text color="success" slot="end" *ngIf="datasheet.available === true">-->
        <!--          <i class="fal fa-fw fa-check"></i>-->
        <!--        </ion-text>-->
        <ion-text color="danger" slot="end" *ngIf="datasheet.available === false">
          <i class="fal fa-fw fa-cloud-download"></i>
        </ion-text>
        <ion-spinner slot="end" *ngIf="datasheet.available === undefined">
          <i class="fal fa-fw fa-cloud-download"></i>
        </ion-spinner>

      </ion-item>
    </ion-list>
  </cdk-virtual-scroll-viewport>
  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button (click)="downloadAllDatasheets()" [disabled]="isDownloading || network.offline">
      <i class="fal fa-fw fa-lg fa-download"></i>
    </ion-fab-button>
  </ion-fab>
</ion-content>

<app-offline-footer></app-offline-footer>
