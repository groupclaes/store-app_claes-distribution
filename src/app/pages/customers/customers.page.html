<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>
      <span translate="customersPage"></span>
      <span *ngIf="customers">
        <span> - </span>
        <span>{{ (customers | slice:0:200).length }}</span>
        <span *ngIf="(customers | slice:0:200).length !== customers.length">/{{ customers.length }}</span>
      </span>
    </ion-title>
    <ion-buttons slot="end">
      <!-- <ion-button tappable routerLink="/customers/customer-create">
        <i class="fal fa-sm fa-fw fa-plus"></i>
      </ion-button> -->
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar [placeholder]="'customer-info.search' | translate" type="text" id="searchInputField" (input)="filterCustomers($event)"></ion-searchbar>
  </ion-toolbar>
</ion-header>
<ion-content [fullscreen]="true" [scrollY]="false" color="light">
  <!-- <ion-header collapse="condense">
    <ion-toolbar color="light">
      <ion-title size="large">
        {{ 'customersPage' | translate }}
        <span *ngIf="customers">
          <span> - </span>
          <span>{{ (customers | slice:0:200).length }}</span>
          <span *ngIf="(customers | slice:0:200).length !== customers.length">/{{ customers.length }}</span>
        </span>
      </ion-title>
    </ion-toolbar>
  </ion-header> -->

  <cdk-virtual-scroll-viewport minBufferPx="1350" maxBufferPx="2350" autosize class="ion-content-scroll-host">
    <ion-list inset="true" *ngIf="customers && (customers.length > 0 || searchTerm.length > 0);else noCustomers">
      <ion-item *cdkVirtualFor="let customer of customers | slice:0:200" tappable (click)="setActiveCustomer(customer)" text-wrap>
        <ion-label>
          <div style="display:flex;flex-direction:column;justify-content:center">
            <span class="text-capitalize">{{ customer.name }} ({{ customer.id }})</span>
            <div *ngIf="customer.addressId > 0">
              <span class="text-capitalize">{{ customer.addressName }} ({{ customer.addressId }})</span>
            </div>
          </div>
        </ion-label>
        <ion-note slot="end">
          <i class="fal fa-fw fa-xs fa-exclamation-triangle" *ngIf="customer.hasUnsentNotes"></i>
          <ion-badge color="light" class="text-capitalize">{{ customer.addressId === 0 ? customer.city : customer.delvCity }}</ion-badge>
        </ion-note>
      </ion-item>
    </ion-list>
  </cdk-virtual-scroll-viewport>

  <ng-template #noCustomers>
    <ion-item class="ion-padding empty-message">
      <span translate="noCustomers"></span>
    </ion-item>
  </ng-template>
</ion-content>

<app-offline-footer></app-offline-footer>
