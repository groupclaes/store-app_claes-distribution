<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title translate="reportsPage"></ion-title>
    <ion-buttons slot="end">
      <ion-button tappable class="icon-only" [routerLink]="cartLink">
        <i class="fal fa-lg fa-fw fa-shopping-cart"></i>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" color="light">
  <ion-header collapse="condense">
    <ion-toolbar color="light">
      <ion-title size="large" translate="reportsPage"></ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-text class="list-header" *ngIf="!loading && myreports.length > 0">
    <ion-note translate>pages.reports.requestedReports</ion-note>
  </ion-text>

  <ion-list inset="true" *ngIf="!loading && myreports.length > 0">
    <ion-item button *ngFor="let report of myreports" tappable (click)="network.online ? showActionMenu(report) : network.noop()">
      <ion-label>
        {{ report.Filename }}
      </ion-label>
      <div slot="end" *ngIf="report.CompletionTime" style="font-style:italic;color:#999;font-size:14px;line-height: 18px">
        <span translate="pages.reports.reportExecutedAt"></span> {{ report.CompletionTime | date:'dd/MM/yyyy HH:mm' }}
      </div>
    </ion-item>
  </ion-list>

  <ion-text class="list-header">
    <ion-note translate>pages.reports.availableReports</ion-note>
  </ion-text>

  <ion-list inset="true">
    <div *ngIf="loading" padding>
      <div style="text-align:center">
        <ion-spinner mode="ios"></ion-spinner>
      </div>
    </div>
    <ion-item button *ngFor="let report of reports" [attr.disabled]="!menuItemActive" tappable (click)="network.online ? confirmRunReport(report) : network.noop()">
      <ion-label>{{ report.name }}</ion-label>
    </ion-item>
  </ion-list>

  <ion-text class="list-footer" *ngIf="!loading && myreports.length <= 0">
    <ion-note translate>pages.reports.noActiveReportsLast2Weeks</ion-note>
  </ion-text>
</ion-content>

<ion-footer *ngIf="network.offline">
  <ion-toolbar color="light">
    <ion-note style="display:flex;justify-content:center;flex-direction:column">
      <div style="text-align: center;">
        <i class="far fa-fw fa-wifi-slash"></i>&nbsp;
        Je bent momenteel offline, sommige functies zijn niet beschikbaar.
      </div>
    </ion-note>
  </ion-toolbar>
</ion-footer>
