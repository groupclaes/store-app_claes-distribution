<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button [text]="backButtonText"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ recipe.name }}</ion-title>
<!--    <ion-buttons slot="end">-->
<!--      <ion-button color="primary" class="icon-button" fill="clear" slot="end" tappable-->
<!--                  (click)="network.online ? share() : network.noop()">-->
<!--        {{ 'actions.share' | translate }}&nbsp;-->
<!--        <i color="primary" class="fal fa-fw fa-share-square"></i>-->
<!--      </ion-button>-->
<!--    </ion-buttons>-->
    <ion-progress-bar type="indeterminate" *ngIf="isDownloading"></ion-progress-bar>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" color="light">
  <ion-text class="list-header">
    <ion-note translate>products</ion-note>
  </ion-text>

  <ion-list [inset]="true" *ngIf="!loading">
    <ion-item button *ngFor="let product of recipe.products" tappable [routerLink]="['/products', product.id]">
      <ion-avatar *ngIf="displayThumbnail" slot="start">
        <img class="product-image" [src]="product.url | secure | async" [title]="product.name" [alt]="product.name"
             loading="lazy" [style]="'background-color:' + product.color" width="32" height="32"/>
      </ion-avatar>
      <ion-label>
        {{ product.name }}
      </ion-label>
      <ion-note slot="end">
        {{ product.unit }}
      </ion-note>
    </ion-item>
  </ion-list>

  <ion-list inset="true">
    <ion-item detail="false" button tappable (click)="open(recipe)">
      <ion-label color="tertiary" style="text-align:center">{{ 'showRecipe' | translate }}</ion-label>
    </ion-item>
  </ion-list>
</ion-content>

<app-offline-footer></app-offline-footer>
