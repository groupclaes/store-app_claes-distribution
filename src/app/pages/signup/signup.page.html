<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>{{ 'signupTitle' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Signup</ion-title>
    </ion-toolbar>
  </ion-header> -->

  <form [formGroup]="form" (submit)="doSignup()">
    <!-- <ion-text class="list-header">
      <ion-note>{{ 'signupTitle' | translate }}</ion-note>
    </ion-text> -->
    <ion-list inset="true" style="margin-bottom:1px">
      <ion-item>
        <ion-input [label]="'pages.register.fields.email' | translate" labelPlacement="stacked" type="email" formControlName="username" autocomplete="email" name="email"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input [label]="'pages.register.fields.first-name' | translate" labelPlacement="stacked" type="text" formControlName="given_name" autocomplete="given-name" name="given-name"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input [label]="'pages.register.fields.last-name' | translate" labelPlacement="stacked" type="text" formControlName="family_name" autocomplete="family-name" name="family-name"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input [label]="'pages.register.fields.password' | translate" labelPlacement="stacked" type="password" formControlName="password" autocomplete="password" name="password"></ion-input>
      </ion-item>
      <ion-item>
        <ion-input [label]="'pages.register.fields.registration-code' | translate" labelPlacement="stacked" type="text" formControlName="code" autocomplete="registration-code" name="registrationCode"></ion-input>
      </ion-item>
    </ion-list>

    <div class="px-4 pt-4">
      <ion-button color="primary" fill="clear" expand="block" type="submit" style="background:white;border-radius:8px" [disabled]="!form.valid">
        <!-- <ion-spinner *ngIf="busy" mode="ios"></ion-spinner> -->
        <ion-label style="text-align:center">{{ 'signupButton' | translate }}</ion-label>
      </ion-button>
    </div>
    <div class="ion-padding buttons-grid">
      <!-- <button ion-button color="light" type="button" block>
        {{ 'howtoRegistrationCode' | translate }}
      </button> -->
      <!-- <ion-button color="light" type="button" tappable (click)="openWebshop()" block>
        {{ 'noCustomer' | translate }}
      </ion-button> -->
    </div>
  </form>
</ion-content>
