<ion-header [translucent]="true"></ion-header>

<ion-content [fullscreen]="true" color="light">
  <div class="splash-bg" [style.background-image]="backgroundImage" id="backgound-image"></div>
  <div class="splash-info">
    <div class="splash-logo"></div>
    <div class="splash-intro" *ngIf="accountForm">
      <form [formGroup]="accountForm" (submit)="login()">
        <ion-list inset="true" style="margin-bottom:1px">
          <ion-item>
            <ion-input type="email" formControlName="username" autocomplete="username" name="email" [label]="'email' | translate" labelPlacement="stacked"></ion-input>
          </ion-item>
          <ion-item>
            <ion-input type="password" formControlName="password" autocomplete="current-password" name="password" [label]="'password' | translate" labelPlacement="stacked"></ion-input>
          </ion-item>
        </ion-list>

        <div class="px-4 pt-4">
          <ion-button color="primary" fill="clear" expand="block" type="submit" style="background:white;border-radius:8px" [disabled]="busy || dbError">
            <ion-spinner *ngIf="busy" mode="ios"></ion-spinner>
            <ion-label style="text-align:center">{{ 'loginButton' | translate }}</ion-label>
          </ion-button>
        </div>

        <ion-text class="list-footer">
          <ion-note>
            <p>
              <span translate="version"></span>
              <span>{{ appVersion }}</span>
            </p>
          </ion-note>
        </ion-text>
      </form>

      <ion-list inset="true">
        <ion-item detail="false" button tappable (click)="network.online ? resetPassword() : network.noop()">
          <ion-label color="tertiary">{{ 'forgotPassword' | translate }}</ion-label>
        </ion-item>
        <ion-item detail="false" button tappable (click)="network.online ? signup() : network.noop()">
          <ion-label color="tertiary">{{ 'noClaesID' | translate }}</ion-label>
        </ion-item>
      </ion-list>

      <ion-text class="list-footer">
        <ion-note>
          {{ 'continueAs' | translate }}<ion-text [style.cursor]="'pointer'" color="tertiary" (click)="network.online ? loginGuest() : network.noop()" translate="guest"></ion-text>.
        </ion-note>
      </ion-text>
    </div>
  </div>
</ion-content>

<app-offline-footer></app-offline-footer>
