<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button [text]="backButtonText"></ion-back-button>
    </ion-buttons>
    <ion-title>
      <span>{{ department.alias | capitalize }}</span>
    </ion-title>
    <!-- <ion-buttons slot="end">
      <ion-button tappable color="tertiary" (click)="showUpdateInput()" translate>
        actions.modify
      </ion-button>
      <ion-button tappable color="danger" (click)="showDeleteConfirmation()" translate>
        actions.delete
      </ion-button>
    </ion-buttons> -->
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" color="light">
  <div *ngIf="loading" padding>
    <div style="text-align:center">
      <ion-spinner mode="ios"></ion-spinner>
    </div>
  </div>

  <ion-text class="list-header">
    <ion-note translate>products</ion-note>
  </ion-text>

  <ion-list [inset]="true" *ngIf="!loading">
    <ion-item button *ngFor="let product of department.products" tappable [routerLink]="['/products', product.id]">
      <ion-avatar *ngIf="displayThumbnail" slot="start">
        <img class="product-image" [src]="product.url | secure | async" [title]="product.name" [alt]="product.name" loading="lazy" [style]="'background-color:' + product.color" width="32" height="32">
      </ion-avatar>
      <ion-label>
        {{ product.name }}
      </ion-label>
      <ion-note slot="end">
        {{ product.unit }}
      </ion-note>
    </ion-item>
  </ion-list>

  <!-- <ion-list inset="true">
    <ion-item detail="false" button tappable (click)="showUpdateInput()">
      <ion-label color="tertiary" style="text-align:center">{{ 'actions.modify' | translate }}</ion-label>
    </ion-item>
  </ion-list> -->

  <ion-list inset="true">
    <ion-item detail="false" button tappable (click)="network.online ? showDeleteConfirmation() : network.noop()">
      <ion-label color="danger" style="text-align:center">{{ 'actions.delete' | translate }}</ion-label>
    </ion-item>
  </ion-list>
</ion-content>

<app-offline-footer></app-offline-footer>
